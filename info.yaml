project:
  title: CHIP-8 Feather companion core
  author: jojys
  discord: ''
  description: Classic CHIP-8 CPU with external memory, framebuffer and keypad on
    RP2350
  language: Verilog
  clock_hz: 1000000
  tiles: 4x2
  top_module: tt_um_chip8_feather
  source_files:
  - project.v
  - chip8_core.v
pinout:
  ui[0]: Response byte bit 0
  ui[1]: Response byte bit 1
  ui[2]: Response byte bit 2
  ui[3]: Response byte bit 3
  ui[4]: Response byte bit 4
  ui[5]: Response byte bit 5
  ui[6]: Response byte bit 6
  ui[7]: Response byte bit 7
  uo[0]: Request byte bit 0
  uo[1]: Request byte bit 1
  uo[2]: Request byte bit 2
  uo[3]: Request byte bit 3
  uo[4]: Request byte bit 4
  uo[5]: Request byte bit 5
  uo[6]: Request byte bit 6
  uo[7]: Request byte bit 7
  uio[0]: Bus phase bit 0
  uio[1]: Bus phase bit 1
  uio[2]: Request valid
  uio[3]: Write operation
  uio[4]: Sound active
  uio[5]: Halted
  uio[6]: Response acknowledge input
  uio[7]: Unused input
yaml_version: 6
